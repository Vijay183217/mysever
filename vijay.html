 
<!-- SQUARE, SQUATE ROOT, CUBE -->    
 
<html> 
 
<head> 
 
<center><h2><b><u> 
 
Square, Square root, Cube, Complement of Integers in Javascript 
 
</u></b></h2></center> 
 
</head> 
 
<script language="javascript">  
 
function square() 
{ 
 
document.write("<center>"+"<b>"+"Square of Integers"+"</b>"+"</center>");  
 
for(i=1;i<100;i++) 
{ 
 
document.write(i*i+"<br>"); 
 
} 
 
} 
 
</script> 
 
<body bgcolor="blue"> 
 
<center> 
 
<form name="f1" method="post"> 
 
<input type="button" name="b1" value="Square" onclick="square()"> 
</form>
</body>
</center>
</html>
